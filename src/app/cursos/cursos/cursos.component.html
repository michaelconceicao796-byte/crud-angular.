<mat-card>
  <mat-card-header>
    <mat-toolbar> Cursos disponiveis </mat-toolbar>
  </mat-card-header>

  <div *ngIf="cursos$ | async as cursos; else loading">
    <mat-card-content>
      <table mat-table [dataSource]="cursos">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Curso</th>
          <td mat-cell *matCellDef="let curso">{{ curso.name }}</td>
        </ng-container>

        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Categoria</th>
          <td mat-cell *matCellDef="let curso">{{ curso.category}}
            <mat-icon aria-hidden="false" aria-label="Categoria do Curso" favicon>{{ curso.category | category }}</mat-icon>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
  </div>

  <ng-template #loading>
    <div class="loading-spinner">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</mat-card>
