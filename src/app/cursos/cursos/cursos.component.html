<mat-card>

<mat-card-header>

<mat-toolbar> Cursos disponiveis </mat-toolbar>
<style>
  mat-toolbar {
    background-color:#3f51b5;
    color: white;
  }
</style>
</mat-card-header>

<mat-card-content>
<table mat-table [dataSource]="cursos">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let curso">{{ curso.name }}</td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Categoria</th>
    <td mat-cell *matCellDef="let curso">{{ curso.category }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>

</mat-card-content>

</mat-card>
