<mat-card>
  <mat-card-header>
    <mat-toolbar style="background-color: #3f51b5; color: white"> Detalhes do curso </mat-toolbar>
  </mat-card-header>


  <mat-card-content>
    <form [formGroup]="form" class="min-width">
      <mat-form-field class="full-width">
        <mat-label> Nome </mat-label>


        <mat-select formControlName="name">
          <mat-option value="null"> </mat-option>
          <mat-option value="front-end">Tela</mat-option>
          <mat-option value="back-end">Atrás da tela</mat-option>
        </mat-select>
      </mat-form-field>


      <mat-form-field class="full-width">
        <mat-label> Categoria </mat-label>

        
        <mat-select formControlName="category">
          <mat-option value="null"></mat-option>
          <mat-option value="front-end">Front-end</mat-option>
          <mat-option value="back-end">Back-end</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button matButton="filled" (click)="onSubmit()">Salvar</button>
    <button matButton="tonal" (click)="onCancel()">Cancelar</button>
  </mat-card-actions>
</mat-card>
