<mat-card>
  <mat-card-header>
    <mat-toolbar style="background-color: #3f51b5; color: white"> Cursos disponiveis </mat-toolbar>
  </mat-card-header>

  <div class="column-flex">
    <app-curso-list
      *ngIf="cursos$ | async as cursos; else loading"
      [cursos]="cursos"
      (add)="onAdd()"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
    ></app-curso-list>

    <mat-card-content>
      <ng-template #loading>
        <div class="loading-spinner">
          <mat-spinner></mat-spinner>
        </div>
      </ng-template>
    </mat-card-content>
  </div>
</mat-card>
